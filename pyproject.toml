[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-agent-economy"
version = "0.1.0"
description = "Controlled local AI-agent economy with Ollama, simulation treasury, approvals, and safe publishing abstractions."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Open Source Contributors" }]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
agent-economy = "agent_economy.cli:main"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_economy"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true
